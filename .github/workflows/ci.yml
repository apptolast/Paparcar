name: CI (Validation)

on:
  push:
    branches:
      - master
      - alpha
      - beta
  pull_request:
    branches:
      - master
      - alpha
      - beta

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Inject Config (Mock/CI)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" > local.properties
          echo "MAPS_API_KEY=mock_key" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # [AUDIT-INFRA-001 C1] With product flavors (prod/mock) the un-flavored task names were
      # ambiguous and the suite (incl. Konsist guardrails) never actually ran in CI. Build BOTH
      # flavors' compilation (mock catches DI/fake drift that prod hides) and run the prod suite.
      - name: Build Check
        run: ./gradlew :app:assembleProdDebug :app:compileMockDebugKotlin --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew :shared:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: shared/build/reports/tests/
          retention-days: 7

  # [CI-IOS-COMPILES-ON-A-MAC-NOT-ON-A-PROMISE-001] Until this job existed, NOTHING compiled
  # iosMain: development happens on Windows (Kotlin/Native for iOS needs macOS) and the job
  # above is ubuntu-only. iOS therefore broke in silence — a bad import, a missing `actual` or
  # a stale type never failed any build we ran, only the one we never ran. macos-latest minutes
  # are free here because the repository is public.
  apple:
    name: iOS framework (Kotlin/Native)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ~/.konan holds the Kotlin/Native toolchain and platform libs — hundreds of MB fetched
      # on first use. Keyed apart from the Linux job: different toolchain, different cache.
      - name: Cache Gradle and Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-macos-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-macos-

      # Needed even though the task lives in :shared: Gradle configures :app too, and its build
      # script reads local.properties and applies the Google Services plugin. Without these the
      # run dies at configuration, before Kotlin/Native ever starts.
      - name: Inject Config (Mock/CI)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" > local.properties
          echo "MAPS_API_KEY=mock_key" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Compiles iosMain with Kotlin/Native and links the ComposeApp framework. This is the half
      # that catches what Windows can break. The Swift under iosApp/ is NOT built yet: xcodebuild
      # needs a shared scheme and this project has none (schemes live in xcuserdata/, gitignored).
      # Sharing it is a checkbox in Xcode's Manage Schemes and belongs to whoever has the Mac;
      # the xcodebuild step joins this job the day that .xcscheme is committed.
      - name: Link iOS framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace

      # GitLive's klibs embed `-framework FirebaseCore` linker opts: the test binary can only
      # link if ld can FIND those frameworks. 11.8.0 is the firebase-ios-sdk version GitLive
      # 2.6.0 is built against (its firebase-cocoapods pin). Only the simulator slices are
      # extracted and cached — the full zip is gigabytes of device/catalyst slices we never link.
      - name: Cache Firebase Apple frameworks
        id: firebase-frameworks
        uses: actions/cache@v4
        with:
          path: ~/firebase-frameworks
          key: firebase-apple-11.8.0-simulator-slices

      - name: Fetch Firebase Apple frameworks (simulator slices)
        if: steps.firebase-frameworks.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/Firebase.zip https://github.com/firebase/firebase-ios-sdk/releases/download/11.8.0/Firebase.zip
          mkdir -p ~/firebase-frameworks
          unzip -q /tmp/Firebase.zip '*ios-arm64_x86_64-simulator*' -d ~/firebase-frameworks
          rm /tmp/Firebase.zip

      # Runs commonTest on Kotlin/Native in the iOS simulator — the SAME suite the Linux job runs
      # on the JVM. Until this step existed the 2100+ tests had never even compiled for iOS: a
      # comma in a backticked test name is legal on the JVM and a compile error on Native, and
      # nothing here would notice. [TEST-A-KMP-SUITE-THAT-ONLY-RUNS-ON-JVM-IS-HALF-A-SUITE-001]
      - name: Run commonTest on iOS simulator
        run: FIREBASE_IOS_FRAMEWORKS="$HOME/firebase-frameworks" ./gradlew :shared:iosSimulatorArm64Test --no-daemon --stacktrace

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: shared/build/reports/tests/iosSimulatorArm64Test/
          retention-days: 7
