name: CI (Validation)

on:
  push:
    branches:
      - master
      - alpha
      - beta
      # The iOS work lives on its own branch and carries its own macOS check — see the `apple`
      # job below for why it no longer runs on every push to master.
      - 'feature/IOS-**'
  pull_request:
    branches:
      - master
      - alpha
      - beta
  # [CI-A-GUARD-THAT-NEVER-STARTS-IS-NOT-A-GUARD-001] The macOS job no longer rides along with
  # every pull request, so the only way to ask for a full Apple check on demand is this.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Inject Config (Mock/CI)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" > local.properties
          echo "MAPS_API_KEY=mock_key" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # [AUDIT-INFRA-001 C1] With product flavors (prod/mock) the un-flavored task names were
      # ambiguous and the suite (incl. Konsist guardrails) never actually ran in CI. Build BOTH
      # flavors' compilation (mock catches DI/fake drift that prod hides) and run the prod suite.
      - name: Build Check
        run: ./gradlew :app:assembleProdDebug :app:compileMockDebugKotlin --no-daemon --stacktrace

      # ⛔ `testAll`, never the task list spelled out here.
      # [TEST-A-GUARD-MUST-NOT-READ-THE-FOLDER-NAME-001] The task exists to be a command you
      # CANNOT write half of, and this step used to write half of it: it named :shared's suite and
      # :app's mock-graph Koin verify, but not `:shared:compileKotlinIosSimulatorArm64` — which
      # `testAll` gained on 21-09, after CI had already stopped running. Eleven green PRs had left
      # `IosAppPreferences` missing two members of `AppPreferences` and nothing noticed.
      # [IOS-THE-ANDROID-SUITE-DOES-NOT-COMPILE-IOS-001]
      #
      # That iOS klib compiles on Linux at ×1, which is why the Apple lane below can stop riding
      # on every pull request without iOS losing its per-run guard: what catches a missing
      # `actual` or a drifted signature runs HERE, on every single run, for free.
      - name: Run unit tests
        run: ./gradlew testAll --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: shared/build/reports/tests/
          retention-days: 7

  # [CI-IOS-COMPILES-ON-A-MAC-NOT-ON-A-PROMISE-001] Until this job existed, NOTHING compiled
  # iosMain: development happens on Windows (Kotlin/Native for iOS needs macOS) and the job
  # above is ubuntu-only. iOS therefore broke in silence — a bad import, a missing `actual` or
  # a stale type never failed any build we ran, only the one we never ran.
  #
  # ⛔ It runs neither on every push to master nor on every pull request, and the reason is money,
  # not confidence. The repository went PRIVATE on 08-09-2026, and on a private repo Actions
  # minutes are metered with macOS charged at 10× — a ten-minute job bills a hundred minutes.
  #
  # [CI-A-GUARD-THAT-NEVER-STARTS-IS-NOT-A-GUARD-001] The 29-08 version kept it on every pull
  # request, and that is what killed CI outright: a free org gets 2.000 minutes a month, ×10 makes
  # that ~13 pull requests, and from 13-09-2026 GitHub refused to start ANY job —
  # "recent account payments have failed or your spending limit needs to be increased", readable
  # only in the check-run annotation. A guard that bills so much it stops every other guard from
  # starting is not protecting anything. The cheapest job in the file was dying because of the
  # most expensive one.
  #
  # So it moves to where iOS actually changes: its own branch, or asked for by hand. What is NOT
  # lost is the half that caught the real breakages — compiling iosMain — because
  # `:shared:compileKotlinIosSimulatorArm64` rides inside `testAll` on the ubuntu job above, at
  # ×1, on every run. What only a Mac can tell us (the framework LINKS, and Xcode builds the app)
  # is what waits here.
  apple:
    name: iOS framework (Kotlin/Native)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/feature/IOS-')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ~/.konan holds the Kotlin/Native toolchain and platform libs — hundreds of MB fetched
      # on first use. Keyed apart from the Linux job: different toolchain, different cache.
      - name: Cache Gradle and Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-macos-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-macos-

      # Needed even though the task lives in :shared: Gradle configures :app too, and its build
      # script reads local.properties and applies the Google Services plugin. Without these the
      # run dies at configuration, before Kotlin/Native ever starts.
      - name: Inject Config (Mock/CI)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" > local.properties
          echo "MAPS_API_KEY=mock_key" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Compiles iosMain with Kotlin/Native and links the ComposeApp framework. This is the half
      # that catches what Windows can break.
      - name: Link iOS framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace

      # GitLive's klibs embed `-framework FirebaseCore` linker opts: the test binary can only
      # link if ld can FIND those frameworks. 11.8.0 is the firebase-ios-sdk version GitLive
      # 2.6.0 is built against (its firebase-cocoapods pin). Only the simulator slices are
      # extracted and cached — the full zip is gigabytes of device/catalyst slices we never link.
      - name: Cache Firebase Apple frameworks
        id: firebase-frameworks
        uses: actions/cache@v4
        with:
          path: ~/firebase-frameworks
          key: firebase-apple-11.8.0-simulator-slices

      # The release asset is a SIGNED WRAPPER (carthage zips + build logs); the real payload is
      # nested at 11_8_0/Firebase-11.8.0-latest.zip, stored uncompressed. Two unzips, then keep
      # only the simulator slices.
      - name: Fetch Firebase Apple frameworks (simulator slices)
        if: steps.firebase-frameworks.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/FirebaseOuter.zip https://github.com/firebase/firebase-ios-sdk/releases/download/11.8.0/Firebase.zip
          unzip -q -j /tmp/FirebaseOuter.zip '*Firebase-11.8.0-latest.zip' -d /tmp/fbinner
          mkdir -p ~/firebase-frameworks
          unzip -q /tmp/fbinner/Firebase-11.8.0-latest.zip '*ios-arm64_x86_64-simulator*' -d ~/firebase-frameworks
          rm -rf /tmp/FirebaseOuter.zip /tmp/fbinner

      # Runs commonTest on Kotlin/Native in the iOS simulator — the SAME suite the Linux job runs
      # on the JVM. Until this step existed the 2100+ tests had never even compiled for iOS: a
      # comma in a backticked test name is legal on the JVM and a compile error on Native, and
      # nothing here would notice. [TEST-A-KMP-SUITE-THAT-ONLY-RUNS-ON-JVM-IS-HALF-A-SUITE-001]
      - name: Run commonTest on iOS simulator
        run: FIREBASE_IOS_FRAMEWORKS="$HOME/firebase-frameworks" ./gradlew :shared:iosSimulatorArm64Test --no-daemon --stacktrace

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: shared/build/reports/tests/iosSimulatorArm64Test/
          retention-days: 7

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/spm-packages
          key: spm-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj') }}
          restore-keys: spm-

      # Builds the ACTUAL app — Swift shell + the "Compile Kotlin Framework" phase (embedAndSign
      # via Gradle) — the full path a human Mac walks. Simulator + unsigned, so neither TEAM_ID
      # nor GoogleService-Info.plist is needed (the plist is a RUNTIME requirement; the Xcode 16
      # synchronized folder bundles it automatically when present). Possible only since the shared
      # .xcscheme was committed. [IOS-XCODE-A-PLIST-THAT-NEVER-ENTERS-THE-BUNDLE-001]
      - name: Build iOS app (xcodebuild)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -clonedSourcePackagesDirPath ~/spm-packages \
            CODE_SIGNING_ALLOWED=NO build
