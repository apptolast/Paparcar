# ─────────────────────────────────────────────────────────────────────────────
# PAPARCAR — Version Catalog
# KMP (Kotlin Multiplatform) + Compose Multiplatform + Clean Architecture
#
# ⛔ UNA clave por línea de release, UN alias por consumidor.
# Lo que ningún `build.gradle.kts` nombra, no vive aquí; dos claves con el mismo valor para la
# misma línea de release son dos sitios donde olvidarse de una.
# [BUILD-THE-CATALOG-SAYS-ONLY-WHAT-THE-BUILD-USES-001]
#
# Al comprobar si algo se ha quedado atrás, consultar `repo1.maven.org/.../maven-metadata.xml` y
# `dl.google.com/dl/android/maven2/.../maven-metadata.xml` — el índice de `search.maven.org` está
# obsoleto y miente por versiones enteras. Solo estables: ni un alpha/beta/rc.
# Último barrido completo: **20-11-2026**.
# ─────────────────────────────────────────────────────────────────────────────

[versions]

# ── Android ──────────────────────────────────────────────────────────────────
agp = "9.5.1"
android-compileSdk = "37"
android-minSdk = "26"      # NotificationChannel (26) + FOREGROUND_SERVICE_LOCATION (29) → mínimo real 26
android-targetSdk = "37"

# ── Kotlin & KMP ─────────────────────────────────────────────────────────────
kotlin = "2.4.21"
ksp = "2.3.14"   # Esquema propio, independiente de la versión de Kotlin

# ── Compose Multiplatform ────────────────────────────────────────────────────
# UNA clave para toda la línea: el plugin y sus artefactos (runtime, foundation, ui,
# ui-tooling(-preview), components-resources) se publican juntos y suben juntos. Eran SEIS claves
# con el mismo valor, y la regla «todas a la vez» tenía que vivir en CLAUDE.md porque el catálogo
# no la podía expresar. [BUILD-THE-CATALOG-SAYS-ONLY-WHAT-THE-BUILD-USES-001]
compose-multiplatform = "1.12.2"
# Material3 de JetBrains va por su cuenta (no hay estable por encima de 1.9.0).
material3 = "1.9.0"
# Lo ÚNICO que queda de la línea Material 2: el paquete de iconos (`Icons.Rounded.*`, 392 imports
# en el repo). Upstream la congeló en 1.7.3 — no es una clave atrasada. Material 2 en sí NO entra:
# cero imports de `androidx.compose.material.*` fuera de `material.icons`.
materialIconsExtended = "1.7.3"

# ── AndroidX ─────────────────────────────────────────────────────────────────
androidx-activityCompose = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-core-ktx = "1.19.1"
androidx-lifecycle = "2.11.1"
androidx-splashscreen = "1.2.0"
androidx-datastore = "1.3.0"
work-runtime = "2.12.0"

# ── Test ─────────────────────────────────────────────────────────────────────
junit = "4.13.2"
androidx-test-junit = "1.3.0"
androidx-espresso-core = "3.7.0"
androidx-test-core = "1.7.0"
turbine = "1.2.1"
konsist = "0.18.1"
robolectric = "4.18.1"

# ── Kotlinx ──────────────────────────────────────────────────────────────────
# ⚠️ `kotlinx-datetime` publica una línea `0.8.0-0.6.x-compat` que ORDENA DESPUÉS de `0.8.0` sin
# ser más nueva: es la variante de compatibilidad con la API 0.6. No leerla como un bump pendiente.
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinx-serialization = "1.13.0"

# ── DI — Koin ────────────────────────────────────────────────────────────────
# Todos los módulos de Koin usan la misma versión. No hay versión separada.
koin = "4.2.2"

# ── Persistencia local — Room KMP ────────────────────────────────────────────
# 2.7.x es la primera línea con soporte KMP completo (commonMain)
room = "2.8.5"
sqlite = "2.7.1"

# ── Firebase ─────────────────────────────────────────────────────────────────
# GitLive SDK: wrapper KMP sobre Firebase oficial → va en commonMain.
# ⚠️ `firebase-bom` NO se publica en Maven Central: su metadata vive sólo en `dl.google.com`
# (`repo1.maven.org/.../firebase-bom/maven-metadata.xml` da 404 siempre, y no es un fallo de red).
# El salto 34→35 fue el último MAJOR: subió `minSdkVersion` a 24 (sin efecto, el nuestro es 26) y
# retiró `firebase-ml-modeldownloader`, que no usamos. [DEPS-REVENUECAT-3-10-AND-A-FULL-SWEEP-001]
# GitLive 2.8.0 es aditivo (release notes leídas: nada retirado).
firebase-bom = "35.2.0"
firebase-crashlytics-plugin = "3.0.8"
firebase-gitlive = "2.8.0"
google-services = "4.6.0"

# ── KMP Maps (fork propio de Software Mansion kmp-maps) ─────────────────────
# Core: Google Maps en Android + Apple Maps en iOS (sin CocoaPods)
# Fork con marker de id estable — DRIVE-PUCK-NATIVE-001. Upstream: 0.9.1, PR #170 sin mergear.
# Publicado en Maven Central desde rndevelo/kmp-maps [BUILD-KMPMAPS-CENTRAL-DEPENDENCY-001].
# ⛔ Esta versión la manda NUESTRO repo, no upstream: subirla es publicar un tag nuevo del fork, no
# leer un índice. Al 20-11 la última publicada es puck6.
kmp-maps = "0.9.1-puck6"

# ── Licencias OSS — AboutLibraries ───────────────────────────────────────────
aboutlibraries = "15.3.0"

# ── Logging — Napier ─────────────────────────────────────────────────────────
napier = "2.7.1"

# ── Image loading — Coil 3 (KMP) ─────────────────────────────────────────────
# coil-compose en commonMain (AsyncImage). Fetcher de red multiplataforma vía
# coil-network-ktor3 (commonMain) + engine Ktor por plataforma: okhttp (Android),
# darwin (iOS). Coil auto-registra el fetcher al estar en el classpath.
coil = "3.6.3"

# ── Ktor client — engine de red para Coil (KMP) ──────────────────────────────
ktor = "3.6.1"

# ── Login Library ────────────────────────────────────────────────────────────
# Publicada en Maven Central desde 2.0.0 (hasta 1.1.0 vivía en JitPack; nada nuevo saldrá allí).
# Grupo `io.github.apptolast`, artifact id `baselogin` — el mismo id que el módulo Gradle.
# ⚠️ Depender SIEMPRE de la publicación raíz: Gradle resuelve solo los artefactos por target
# (`baselogin-android`, `baselogin-iosarm64`, `baselogin-iossimulatorarm64`); nunca declararlos.
# 3.0.0 (13-09-2026): major por AMPLIAR sealed, no por retirar nada — +8 `AuthError`,
# `SocialTokenResult.Failed`, `RegisterEffect.EmailVerificationRequired` y
# `GoogleSignInProviderAndroid.PickerOutcome`. Comparado el AAR clase a clase: nada borrado.
# Paparcar no hace `when` exhaustivo sobre ninguno, así que el bump es drop-in.
# ⛔ No se toca desde Paparcar: vive en su propio repo.
baselogin = "3.0.2"

# ── Monetización — RevenueCat purchases-kmp ─────────────────────────────────
# ⛔ **No volver a declarar a mano el artefacto Android `purchases`**: el wrapper lo pina por su
# cuenta (purchases-android 11.3.0 en 4.2.0), muy por encima del punto donde las consumer rules de
# R8 dejaron de anclar el SDK entero. El puente de [R8-REVENUECAT-ALREADY-NARROWED-ITS-RULES-001]
# sigue muerto. [BUILD-DEPS-AT-LATEST-STABLE-002]
# 3.14.0 → 4.2.0 (20-11-2026), MAJOR leído antes de tocarlo (`migrations/4.0.0-MIGRATION.md`):
#   · compileSdk ≥ 35 para la app y todo módulo que dependa del SDK → el nuestro es 37.
#   · La Play Store bloqueada ahora da `PurchaseNotAllowedError` y no `StoreProblemError` — Paparcar
#     no nombra `PurchasesErrorCode` en ninguna línea, así que no hay `when` que se quede corto.
#   · Arrow 2 y Compose BOM 2026.06.01 llegan por `purchases-kmp-either` y `purchases-kmp-ui`, y no
#     usamos ninguno de los dos: sólo `purchases-kmp-core`.
# Lo que sí entra de verdad es **Play Billing Library 9.1.0** en el classpath del APK, y ningún otro
# plugin de compras vive en la app con quien chocar.
# [BUILD-THE-CATALOG-SAYS-ONLY-WHAT-THE-BUILD-USES-001]
purchases-kmp = "4.2.0"

# ── Android-only ─────────────────────────────────────────────────────────────
# play-services-location incluye Activity Recognition Transitions desde v17+
play-services-location = "21.4.0"
glance = "1.2.0"
navigation-compose = "2.10.0"
# Meta SDK — SOLO `facebook-core` (App Events). ⛔ Nunca `facebook-android-sdk`, que arrastra
# login, share y gráfico social: Paparcar no usa ninguno y cada uno es superficie publicada.
# [MKT-META-APP-EVENTS-COST-THE-NO-ADS-PROMISE-001]
facebook-sdk = "19.0.1"
# Google Play Install Referrer API — lee el referrer UNA vez por instalación, nunca se vuelve a
# publicar desde Dic-2020: 2.2 sigue siendo la última. [MKT-INSTALL-ATTRIBUTION-CHANNEL-001]
install-referrer = "2.2"
play-review = "2.0.2"


# ─────────────────────────────────────────────────────────────────────────────
[libraries]
# ─────────────────────────────────────────────────────────────────────────────

# ── Compose Multiplatform ────────────────────────────────────────────────────
runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
# Solo el paquete de iconos de la línea Material 2 — ver la nota de su versión.
material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }

# ── Test ─────────────────────────────────────────────────────────────────────
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-espresso-core" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work-runtime" }

# ── AndroidX ─────────────────────────────────────────────────────────────────
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-splashscreen" }
# lifecycle-service → el FGS de detección (androidMain). Las variantes de ViewModel NO se declaran:
# llegan con Compose Multiplatform y la navegación, y los tres alias que las nombraban no tenían un
# solo consumidor. [BUILD-THE-CATALOG-SAYS-ONLY-WHAT-THE-BUILD-USES-001]
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "androidx-lifecycle" }

# WorkManager (Android-only, tareas en background)
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work-runtime" }

# DataStore (Android-only preferences)
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }

# ── Kotlinx ──────────────────────────────────────────────────────────────────
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# ── DI — Koin ────────────────────────────────────────────────────────────────
# commonMain
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
# commonMain — integración Compose Multiplatform (koinViewModel, get, inject en @Composable)
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
# commonMain — koinViewModel() con soporte de ViewModel KMP
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
# androidMain — integración Android específica (AndroidViewModel, SavedStateHandle)
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
# androidMain — koinViewModel() con scoping de Android ViewModel (Activity/Fragment backstack)
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
# androidUnitTest — verify() estático del grafo de módulos [DET-KOIN-MODULE-VERIFY-001]
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

# ── Persistencia local — Room KMP ────────────────────────────────────────────
# room-runtime en commonMain, room-compiler solo via KSP (ver bloque dependencies)
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# ── Firebase (GitLive SDK — KMP) ─────────────────────────────────────────────
# Todos van en commonMain. GitLive wrappea Firebase oficial con expect/actual.
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-firestore = { module = "dev.gitlive:firebase-firestore", version.ref = "firebase-gitlive" }
firebase-auth = { module = "dev.gitlive:firebase-auth", version.ref = "firebase-gitlive" }
firebase-common = { module = "dev.gitlive:firebase-common", version.ref = "firebase-gitlive" }
firebase-analytics = { module = "dev.gitlive:firebase-analytics", version.ref = "firebase-gitlive" }

# ── KMP Maps (fork propio) ───────────────────────────────────────────────────
# El paquete del código sigue siendo com.swmansion.kmpmaps.core; solo cambian las coordenadas.
kmp-maps-core = { module = "io.github.rndevelo.kmpmaps:core", version.ref = "kmp-maps" }

# ── Licencias OSS — AboutLibraries (solo el core: los DATOS, no su UI) ───────
aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutlibraries" }

# ── Logging — Napier (KMP) ───────────────────────────────────────────────────
napier = { module = "io.github.aakira:napier", version.ref = "napier" }

# ── Image loading — Coil 3 (KMP) ─────────────────────────────────────────────
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# ── Ktor client engines (motor de red de Coil, uno por plataforma) ───────────
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }  # androidMain
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }  # iosMain
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }      # commonTest

# ── Login Library (Maven Central) ─────────────────────────────────────────────
baselogin = { module = "io.github.apptolast:baselogin", version.ref = "baselogin" }

# ── Monetización — RevenueCat KMP ────────────────────────────────────────────
# Solo el core, en commonMain (repositorio de entitlements + configure); el paywall se dibuja con
# nuestro propio Compose, así que `purchases-kmp-ui` no entra. En Android arrastra Play Billing
# Library al APK. [MONEY-001]
purchases-core = { module = "com.revenuecat.purchases:purchases-kmp-core", version.ref = "purchases-kmp" }

# ── Android-only: Detección ──────────────────────────────────────────────────
# Incluye FusedLocationProviderClient + Activity Recognition Transitions API
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "play-services-location" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
# Compose Navigation KMP
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

# Meta SDK — App Events
facebook-core = { module = "com.facebook.android:facebook-core", version.ref = "facebook-sdk" }
# Google Play Install Referrer — lectura del canal de instalación. [MKT-INSTALL-ATTRIBUTION-CHANNEL-001]
install-referrer = { module = "com.android.installreferrer:installreferrer", version.ref = "install-referrer" }
play-review-ktx = { module = "com.google.android.play:review-ktx", version.ref = "play-review" }


# ─────────────────────────────────────────────────────────────────────────────
[plugins]
# ─────────────────────────────────────────────────────────────────────────────
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
googleServices = { id = "com.google.gms.google-services", version.ref = "google-services" }
firebaseCrashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics-plugin" }
room = { id = "androidx.room", version.ref = "room" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
aboutLibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutlibraries" }
