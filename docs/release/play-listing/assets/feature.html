<!doctype html>
<meta charset="utf-8">
<style>
  /* Plus Jakarta Sans: the only family the app ships since
     UI-TYPE-RETIRE-THE-OLD-FAMILIES-001 (Outfit/Inter no longer exist in the repo). */
  @font-face{font-family:Jakarta;src:url("fonts/plus_jakarta_sans_variable.ttf");font-weight:200 800}
  html,body{margin:0;padding:0;background:#000}
  .fg{width:1024px;height:500px;position:relative;overflow:hidden;
      background:radial-gradient(120% 140% at 18% 30%, #15251F 0%, #0D1117 55%, #080B0A 100%)}
  .glow{position:absolute;inset:0;
        background:radial-gradient(38% 70% at 22% 46%, rgba(37,244,140,.18) 0%, rgba(37,244,140,0) 70%)}
  .grid{position:absolute;inset:0;opacity:.5}
  .left{position:absolute;left:78px;top:0;height:500px;display:flex;flex-direction:column;
        justify-content:center;gap:0}
  .mark{display:flex;align-items:center;gap:22px}
  .word{font-family:Jakarta;font-weight:800;font-size:82px;color:#F2F5F4;letter-spacing:-1.5px;line-height:1}
  .tag{font-family:Jakarta;font-weight:500;font-size:31px;color:#A9B4B1;margin-top:26px;line-height:1.32;max-width:470px}
  .tag b{color:#25F48C;font-weight:600}
  .disc{width:104px;height:104px;flex:0 0 104px}
</style>

<div class="fg" id="v1">
  <div class="glow"></div>
  <!-- stylised street grid + spot markers -->
  <svg class="grid" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#25F48C" stroke-opacity=".10" stroke-width="2" fill="none">
      <path d="M640 -40 L640 540 M790 -40 L790 540 M940 -40 L940 540"/>
      <path d="M560 120 L1064 120 M560 260 L1064 260 M560 400 L1064 400"/>
    </g>
    <g stroke="#25F48C" stroke-opacity=".05" stroke-width="26" fill="none" stroke-linecap="round">
      <path d="M700 -40 L700 540"/><path d="M560 330 L1064 330"/>
    </g>
    <!-- free spot (fresh) -->
    <g transform="translate(715 195)">
      <circle r="46" fill="#25F48C" fill-opacity=".12"/>
      <circle r="27" fill="#25F48C" fill-opacity=".22" stroke="#25F48C" stroke-width="2.5"/>
      <circle r="10" fill="#25F48C"/>
    </g>
    <!-- ageing spot -->
    <g transform="translate(905 335)">
      <circle r="34" fill="#F4A825" fill-opacity=".10"/>
      <circle r="20" fill="#F4A825" fill-opacity=".18" stroke="#F4A825" stroke-width="2.5"/>
      <circle r="7.5" fill="#F4A825"/>
    </g>
    <!-- your parked car -->
    <g transform="translate(838 96)">
      <circle r="26" fill="#0B0F0E" stroke="#5B9EFF" stroke-width="2.5"/>
      <circle r="8" fill="#5B9EFF"/>
    </g>
    <!-- driving-away trail -->
    <path d="M715 195 C 760 250, 800 290, 905 335" stroke="#25F48C" stroke-opacity=".30"
          stroke-width="3" stroke-dasharray="9 11" fill="none" stroke-linecap="round"/>
  </svg>

  <div class="left">
    <div class="mark">
      <svg class="disc" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
        <circle cx="54" cy="54" r="54" fill="#0D1117"/>
        <circle cx="54" cy="54" r="52.5" fill="none" stroke="#25F48C" stroke-opacity=".28" stroke-width="2"/>
        <g transform="translate(54 54) scale(0.74) translate(-54 -54)">
          <path transform="translate(-6 -6)" fill="#25F48C" d="M92.28,57.77q-4.78,0.15 -14.83,0.24l-9.33,0.07h0c1.82,-2.13 6.79,-8.57 8,-10.44q3.66,-5.72 4.06,-10.31A7.26,7.26 0 0 0 77,30.25Q73.36,27.78 66.88,28a34.45,34.45 0 0 0 -8.79,1.49A35.71,35.71 0 0 0 43.66,38a51.59,51.59 0 0 0 -6.36,8.38q-1.77,2.74 -4.63,7.43c-1.9,3.12 -3.42,5.56 -4.54,7.31S25.6,65 23.91,67.59A1.34,1.34 0 0 0 25,69.67l64,0a1.36,1.36 0 0 0 1.14,-0.63l3.46,-5.54 2.49,-3.77a1.34,1.34 0 0 0 -1.18,-2.08Zm-49.74,0.3a1.34,1.34 0 0 1 -1.12,-2l1.3,-2.14c0.93,-1.55 1.88,-3.09 2.87,-4.63a31.51,31.51 0 0 1 3,-4 16.45,16.45 0 0 1 3.09,-2.63A16.21,16.21 0 0 1 59.88,40a8.71,8.71 0 0 1 5.47,1.26 3.75,3.75 0 0 1 1.54,3.84 15.56,15.56 0 0 1 -2.53,5.87c-0.93,1.44 -3.59,5.13 -5.27,7.21h-0.54Q50.81,58.2 42.54,58.07Z"/>
          <g transform="translate(-41.78 61.43) rotate(-40)"><ellipse cx="74.74" cy="82.86" rx="8.73" ry="6.15" fill="none" stroke="#25F48C" stroke-width="6"/></g>
          <g transform="translate(-50.1 38.57) rotate(-40)"><ellipse cx="39.18" cy="82.86" rx="8.73" ry="6.15" fill="none" stroke="#25F48C" stroke-width="6"/></g>
        </g>
      </svg>
      <div class="word">Paparcar</div>
    </div>
    <div class="tag" id="tag">Park and forget it.<br><b>Paparcar remembers.</b></div>
  </div>
</div>
<script>
  // Render with ?lang=en|es|it|pt|fr|de|nl|pl|ro (default en). Same taglines as the
  // listing copy: "remembers" verb matches each locale's short description verb.
  const TAGS = {
    en:'Park and forget it.<br><b>Paparcar remembers.</b>',
    es:'Aparca y olvídate.<br><b>Paparcar lo recuerda.</b>',
    it:'Parcheggia e dimenticatene.<br><b>Paparcar se lo ricorda.</b>',
    pt:'Estaciona e esquece.<br><b>O Paparcar lembra-se.</b>',
    fr:'Garez-vous et n\'y pensez plus.<br><b>Paparcar s\'en souvient.</b>',
    de:'Parken und vergessen.<br><b>Paparcar merkt es sich.</b>',
    nl:'Parkeer en vergeet het.<br><b>Paparcar onthoudt het.</b>',
    pl:'Zaparkuj i zapomnij.<br><b>Paparcar pamięta.</b>',
    ro:'Parchează și uită.<br><b>Paparcar ține minte.</b>',
  };
  const lang = new URLSearchParams(location.search).get("lang") || "en";
  document.getElementById("tag").innerHTML = TAGS[lang];
</script>
