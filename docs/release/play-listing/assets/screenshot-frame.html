<!--
  [PLAY-SHOTS-A-LISTING-IS-COMPOSED-NOT-CROPPED-001] Play carousel compositor.

  Render with ?n=1..8&lang=en|es|it|pt|fr|de|nl|pl|ro (defaults: n=1, lang=en), 1080x1920.

  Three things make this a COMPOSITION and not a cropped screenshot with a caption on top:

  1. THE STRIP. The eight frames are eight windows onto ONE 8640x1920 canvas: `.strip` is drawn
     whole and shifted left by (n-1)*1080. The gradient, the glow blobs and the route line cross
     from one frame into the next, so the carousel reads as a single panel when you swipe it —
     and each frame still stands alone, because nothing that carries meaning is cut in half.
  2. THE DEVICE. The phone is inside a real bezel, whole, with its own shadow. The old template
     let the capture bleed off the bottom edge, which reads as a developer's screen grab.
  3. THE SHAPE FOLLOWS THE PROMISE. `hero` when one screen says it all, `pair` when the story is
     two moments, `detail` when the value is one datum worth magnifying.

  The magnified `detail` window is a crop of the SAME raw capture, never a hand-drawn imitation of
  the UI: a callout drawn in HTML is a promise the binary doesn't sign. Its crop rect is in raw
  device pixels (1080x2400) and it carries NO caption of its own — a caption would be a 10th
  string to translate nine times, and the headline above already says what it means.
-->

// ---------------------------------------------------------------------------------------------
// Composition. One entry per frame: which raws it mounts, in which shape, and where.
// `screen` is the width the capture is drawn at (its 1080x2400 aspect is preserved); `crop` is in
// RAW device pixels and `z` the scale the crop is drawn at — z=1 means one raw pixel per canvas
// pixel, which next to a phone drawn at screen/1080 is a magnification of 1080/screen.
// ---------------------------------------------------------------------------------------------
// Optional local preview root keeps a single-locale review from overwriting the tracked EN raws.

const RAW_W = 1080, RAW_H = 2400;

// The bezel and the corner radius are proportional to the drawn width, so a phone at 452 and one
// at 620 are the SAME device seen from further away — not two different products.
function device({ screen, left, top, rot = 0 }, src) {
  const b = Math.round(screen * 0.033);               // bezel
  const r = Math.round(screen * 0.105);               // outer radius
  const h = Math.round(screen * RAW_H / RAW_W);
  const el = document.createElement('div');
  el.className = 'device';
  el.style.cssText = `left:${left}px;top:${top}px;width:${screen + 2 * b}px;height:${h + 2 * b}px;
    padding:${b}px;border-radius:${r}px;transform:rotate(${rot}deg)`;
  el.innerHTML = `<div class="screen" style="width:${screen}px;height:${h}px;border-radius:${r - b}px">
      <img src="${RAW(src)}" style="width:${screen}px">
    </div><div class="gloss" style="border-radius:${r}px"></div>`;
  return el;
}

// The window is always the same size on the canvas: the zoom is DERIVED from the rect the device
// reported, not written down next to it. Clamped so a rect that comes back unexpectedly small
// cannot blow the magnification up to something that reads as a different app.
function callout(cfg, src, anchor) {
  const { left, top, target } = cfg;
  const crop = (anchor && cfg.fromAnchor) ? cfg.fromAnchor(anchor) : cfg.crop;
  const z = Math.max(0.6, Math.min(1.35, target / crop[2]));
  const [cx, cy, cw, ch] = crop;
  const iw = Math.round(cw * z), ih = Math.round(ch * z);
  const el = document.createElement('div');
  el.className = 'callout';
  el.style.cssText = `left:${left}px;top:${top}px;width:${iw}px`;
  el.innerHTML = `<div class="win" style="width:${iw}px;height:${ih}px">
      <img src="${RAW(src)}" style="width:${Math.round(RAW_W * z)}px;
           left:${-Math.round(cx * z)}px;top:${-Math.round(cy * z)}px">
    </div>`;
  return el;
}

  const pts = [[-120,470],[420,520],[980,455],[1560,540],[2180,470],[2760,545],
               [3340,465],[3960,535],[4540,470],[5120,545],[5700,465],[6320,535],
               [6900,470],[7480,540],[8080,470],[8760,530]];
  const R = 120;                                       // rounded turns, like a route, not a wave
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i - 1], [x, y] = pts[i], [nx, ny] = pts[i + 1];
    const a = Math.hypot(x - px, y - py), b = Math.hypot(nx - x, ny - y);
    const t1 = Math.min(R, a / 2) / a, t2 = Math.min(R, b / 2) / b;
    d += ` L ${x - (x - px) * t1} ${y - (y - py) * t1}`;
    d += ` Q ${x} ${y} ${x + (nx - x) * t2} ${y + (ny - y) * t2}`;
  }
  const last = pts[pts.length - 1];
  return d + ` L ${last[0]} ${last[1]}`;
}

(function drawRoute() {
  const d = routePath();
  document.getElementById('route').innerHTML = `
    <defs><filter id="g" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="26"/></filter></defs>
    <path d="${d}" stroke="#25F48C" stroke-opacity=".20" stroke-width="16"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#g)"/>
    <path d="${d}" stroke="#25F48C" stroke-opacity=".26" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="34 26"/>`;
})();

const q = new URLSearchParams(location.search);
const n = q.get('n') || '1';
const lang = q.get('lang') || 'en';
// `anchor=x1,y1,x2,y2` — where the thing to magnify actually was on THIS locale's capture, read off
// the device at shoot time. Without it the built-in rect (measured in English) is used.
const anchor = (q.get('anchor') || '').split(',').map(Number);
const anchorRect = anchor.length === 4 && anchor.every(v => Number.isFinite(v)) ? anchor : null;
const f = T[lang][n], c = FRAMES[n];

document.getElementById('index').textContent = `${String(n).padStart(2, '0')} / 08`;
document.getElementById('strip').style.left = `${-(Number(n) - 1) * 1080}px`;
document.getElementById('h').innerHTML = f.h;
document.getElementById('s').innerHTML = f.s;

const stage = document.getElementById('stage');
if (c.kind === 'pair') {
  stage.appendChild(device(c.backDev, c.back));
  stage.appendChild(device(c.frontDev, c.front));
} else {
  stage.appendChild(device(c.device, c.shot));
  if (c.kind === 'detail') stage.appendChild(callout(c.call, c.shot, anchorRect));
}

// German and Polish run long, and a headline that overflows its band lands ON the phone. Shrink
// to fit instead of trusting one language's line count — measured, not eyeballed.
function fit(el, maxH, from, min) {
  let px = from;
  el.style.fontSize = px + 'px';
  while (el.scrollHeight > maxH && px > min) { px -= 2; el.style.fontSize = px + 'px'; }
  return px;
}
document.fonts.ready.then(() => {
  const h = document.getElementById('h'), s = document.getElementById('s');
  fit(h, 232, 66, 44);
  fit(s, 116, 31, 24);
});
