org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.native.ignoreDisabledTargets=true

# ── KMP + AGP compatibility ──────────────────────────────────────────────────
# [ARCH-HEALTH-001 F7] These two survived the :app/:shared split, and NOT for the old reason.
# The split did remove the deprecated combination they were first added for (KMP +
# com.android.application in ONE module): :app is now a plain application module.
#
# They remain because :shared must use `com.android.library` + androidTarget(), and AGP 9
# only tolerates that pairing behind these flags. The modern replacement,
# `com.android.kotlin.multiplatform.library`, is unusable here: Compose Multiplatform 1.12.0
# registers `copyAndroidMainComposeResourcesToAndroidAssets` without an `outputDirectory` for
# it, so EVERY composeResource (drawables, fonts, all 9 locales of strings) is silently
# dropped from the APK. Measured on the Redmi 29-08: builds, installs and passes 1.762 tests,
# then dies on first frame with MissingResourceException.
#
# Re-check when Compose Multiplatform ships support for the new plugin; the swap is then two
# lines in shared/build.gradle.kts. Until then, deleting these flags breaks the build outright.
android.builtInKotlin=false
android.newDsl=false
